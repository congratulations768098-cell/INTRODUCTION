<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB GENIUS - Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>GB GENIUS</h1>
    </header>
    <main class="profile-container">
        <div class="details">
            <p><strong>Birthday:</strong> 13 January</p>
            <p><strong>Address:</strong> Warisaliganj, Nawada (805130)</p>
            <p><strong>Diploma:</strong> Civil Engineering (Government Polytechnic Gopalganj)</p>
            <p><strong>B Tech:</strong> Computer Science & Engineering (Government College Engineering Kishanganj)</p>
        </div>
        <div class="image-container">
            <img id="profileImage" src="profile.jpg" alt="GB GENIUS Profile" class="banner-image">
        </div>
    </main>
    <nav>
        <a href="second.html">Go to Second Page</a>
    </nav>
    <div class="admin-panel">
        <button id="toggleAdmin">Admin Panel (Upload Image)</button>
        <div id="adminContent" class="hidden">
            <input type="file" id="imageUpload" accept="image/*">
            <p>Upload a new banner image (9:16 ratio recommended).</p>
        </div>
    </div>
    <script src="script.js"></script>
